<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Scanner V10.6 - 逻辑定稿版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&family=Inter:wght@400;600;900&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* 顶部控制栏 */
        .segmented-control { display: flex; background: white; border: 1px solid #e2e8f0; border-radius: 1.2rem; overflow: hidden; }
        .segment { flex: 1; padding: 0.8rem; border-right: 1px solid #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .segment:last-child { border-right: none; }
        .segment-label { font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
        .segment-input { width: 100%; border: none; text-align: center; font-weight: 900; color: #1e293b; font-size: 1.1rem; outline: none; background: transparent; }
        
        .rank-mini { width: 22px; height: 22px; border-radius: 50%; background: #fef9c3; color: #a16207; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 1px solid #fde047; }
        .tv-icon-lg { font-size: 20px; color: #3b82f6; opacity: 0.8; transition: all 0.2s; }
        .tv-icon-lg:hover { transform: scale(1.2); opacity: 1; }

        .reso-capsule { padding: 6px 14px; border-radius: 12px; background: #f1f5f9; display: flex; flex-direction: column; align-items: center; min-width: 80px; }
        .reso-active { background: #dcfce7; border: 1px solid #22c55e; }
        .reso-count { font-size: 13px; font-weight: 900; color: #475569; }

        /* 标签样式 */
        .data-tag { padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; border: 1px solid #e2e8f0; font-family: 'JetBrains Mono', monospace; }
        .tag-buy { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
        .tag-rvol { background: #fffbeb; color: #92400e; border-color: #fef3c7; }
        .tag-rsi { background: #f8fafc; color: #1e293b; border-color: #e2e8f0; }
        .tag-new { background: #f59e0b; color: white; font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: 900; margin-left: 4px; }

        .date-chip { padding: 10px 4px; border-radius: 10px; font-size: 11px; font-weight: 900; color: #94a3b8; cursor: pointer; flex: 1; border: 1px solid transparent; text-align: center; }
        .date-chip.active { background: white; color: #1e293b; border-color: #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .date-chip.has-data { color: #3b82f6; }

        .heat-row td { font-size: 13px; padding: 14px 4px; }
    </style>
</head>
<body class="p-3 md:p-6 text-slate-800">
    <div id="app" class="max-w-[2200px] mx-auto">
        
        <!-- 头部 -->
        <div class="flex justify-between items-center mb-8 bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4">
                <div class="bg-slate-900 w-11 h-11 rounded-2xl shadow-lg flex items-center justify-center text-yellow-400">
                    <i class="fas fa-microchip text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tighter italic">POWER SCANNER <span class="text-blue-600 not-italic">V10.6</span></h1>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Full Logic Decided</p>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="hidden sm:block text-right">
                    <div id="progressText" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">READY</div>
                    <div id="statusDetail" class="text-[10px] font-bold text-blue-500 uppercase tracking-tighter">全币种数据穿透中</div>
                </div>
                <button id="scanBtn" onclick="startScan()" class="px-10 py-4 bg-slate-900 hover:bg-black text-white font-black rounded-xl shadow-xl transition-all active:scale-95 flex items-center">
                    <i class="fas fa-satellite mr-2 text-emerald-400"></i> 全维扫描
                </button>
            </div>
        </div>

        <!-- 参数控制区 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-8">
            <div class="segmented-control shadow-sm">
                <div class="segment"><span class="segment-label">成交额门槛(M)</span><input type="number" id="volumeInput" class="segment-input" value="15" onchange="saveConfig()"></div>
                <div class="segment"><span class="segment-label">符合根数门槛</span><input type="number" id="barsInput" class="segment-input" value="10" onchange="saveConfig()"></div>
                <div class="segment">
                    <span class="segment-label">扫描周期</span>
                    <select id="intervalInput" class="segment-input" onchange="saveConfig()"><option value="1h">1H</option><option value="4h" selected>4H</option><option value="1d">1D</option></select>
                </div>
            </div>
            <div class="segmented-control shadow-sm border-blue-50">
                <div class="segment !flex-row !gap-4 !px-6">
                    <div id="btnLong" onclick="setDirection('long')" class="px-5 py-2.5 font-black rounded-xl cursor-pointer bg-emerald-500 text-white shadow-lg">上涨趋势</div>
                    <div id="btnShort" onclick="setDirection('short')" class="px-5 py-2.5 font-black rounded-xl cursor-pointer bg-slate-100 text-slate-400">下跌趋势</div>
                </div>
                <div class="segment"><span class="segment-label">EMA组</span><div class="flex gap-1"><input type="number" id="emaVal1" class="segment-input !text-sm" value="21" onchange="saveConfig()"><input type="number" id="emaVal2" class="segment-input !text-sm" value="55" onchange="saveConfig()"><input type="number" id="emaVal3" class="segment-input !text-sm" value="100" onchange="saveConfig()"></div></div>
            </div>
        </div>

        <!-- 结果展示 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-7 bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden flex flex-col min-h-[750px]">
                <div class="px-8 py-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <h3 class="font-black text-slate-700 text-xs uppercase tracking-widest">趋势发现看板</h3>
                    <div id="foundCountPill" class="text-[10px] font-black bg-blue-600 text-white px-4 py-1 rounded-full uppercase italic tracking-widest">IDLE</div>
                </div>
                <div id="progressCont" class="hidden h-1.5 bg-blue-100 overflow-hidden"><div id="progressBar" class="h-full bg-blue-600 transition-all duration-300 w-0"></div></div>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-slate-400 text-[10px] font-black uppercase tracking-widest border-b border-slate-50">
                                <th class="py-6 pl-8">资产名称</th>
                                <th class="py-6">价格</th>
                                <th class="py-6">24H 涨跌</th>
                                <th class="py-6">24H 成交额</th>
                                <th class="py-6">主买</th>
                                <th class="py-6">乖离</th>
                                <th class="py-6">动能</th>
                                <th class="py-6">RSI(14)</th>
                                <th class="py-6 pr-8 text-right">趋势共振</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTable" class="divide-y divide-slate-50 font-bold text-slate-800 text-sm">
                            <tr><td colspan="9" class="py-48 text-center text-slate-200 font-black italic tracking-widest text-xl uppercase">Start Scan to Load Data</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="lg:col-span-5 bg-white rounded-[2.5rem] border border-slate-200 shadow-sm h-full overflow-hidden flex flex-col min-h-[750px]">
                <div id="heatHeader" class="p-6 bg-slate-900 text-white">
                    <div class="flex justify-between items-center mb-5 px-2">
                        <h2 id="heatTitle" class="font-black tracking-tight italic text-lg text-emerald-400">涨幅热力榜</h2>
                        <button onclick="clearHeatmap()" class="text-[10px] text-slate-500 hover:text-white uppercase font-black">重置</button>
                    </div>
                    <div class="flex justify-between gap-1" id="dateSelector"></div>
                </div>
                <div class="overflow-x-auto flex-1 bg-white">
                    <table class="w-full text-center heat-table">
                        <thead>
                            <tr class="bg-slate-50/50 text-[10px] font-black text-slate-400 uppercase">
                                <th class="pl-6 text-left">资产名称</th>
                                <th class="text-blue-600">24H涨跌</th>
                                <th>成交量</th>
                                <th>主买</th>
                                <th>乖离率</th>
                                <th>动能</th>
                                <th>RSI</th>
                                <th class="pr-6 text-right text-emerald-600">破高(天)</th>
                            </tr>
                        </thead>
                        <tbody id="heatmapContent" class="font-bold text-slate-800"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentDir = 'long';
        let viewDate = new Date().toISOString().split('T')[0];
        const AppState = { symbols: ['BTCUSDT','ETHUSDT','BNBUSDT','XRPUSDT','SOLUSDT','TRXUSDT','DOGEUSDT','ADAUSDT','BCHUSDT','WBTCUSDT','LINKUSDT','HYPEUSDT','XMRUSDT','LEOUSDT','ZECUSDT','XLMUSDT','LTCUSDT','SUIUSDT','AVAXUSDT','HBARUSDT','SHIBUSDT','CROUSDT','TONUSDT','UNIUSDT','DOTUSDT','AAVEUSDT','OKBUSDT','TAOUSDT','BITUSDT','FTMUSDT','NEARUSDT','ETCUSDT','ICPUSDT','PEPEUSDT','PepeUSDT','ENAUSDT','MKRUSDT','WLDUSDT','ONDOUSDT','APTUSDT','POLUSDT','ARBUSDT','ALGOUSDT','ATOMUSDT','FILUSDT','FLRUSDT','QNTUSDT','VETUSDT','GTUSDT','SEIUSDT','BONKUSDT','RENDERUSDT','CAKEUSDT','JUPUSDT','OPUSDT','FETUSDT','LDOUSDT','STXUSDT','TIAUSDT','GALAUSDT','PENDLEUSDT','THETAUSDT','NEOUSDT','RUNEUSDT','INJUSDT','DYDXUSDT','STRKUSDT','GRTUSDT','FLOKIUSDT','JASMYUSDT','ZKUSDT','SANDUSDT','EIGENUSDT','HNTUSDT','FLOWUSDT','EOSUSDT','COMPUSDT','RAYUSDT','MANAUSDT','ARUSDT','LUNCUSDT','1INCHUSDT','XECUSDT','GLMUSDT','EGLDUSDT','FTTUSDT','SFPUSDT','RSRUSDT','NEIROUSDT','APEUSDT','JTOUSDT','ATHUSDT','SNXUSDT','AXSUSDT','LPTUSDT'], loading: false, longMatches: [], shortMatches: [], lastTickers: null, analyzedData: {} };

        function saveConfig() { localStorage.setItem('ema_v10_6_cfg', JSON.stringify({ v: document.getElementById('volumeInput').value, b: document.getElementById('barsInput').value, i: document.getElementById('intervalInput').value, e1: document.getElementById('emaVal1').value, e2: document.getElementById('emaVal2').value, e3: document.getElementById('emaVal3').value, d: currentDir })); }
        function loadConfig() { const s = localStorage.getItem('ema_v10_6_cfg'); if(s){ const c = JSON.parse(s); document.getElementById('volumeInput').value=c.v; document.getElementById('barsInput').value=c.b; document.getElementById('intervalInput').value=c.i; document.getElementById('emaVal1').value=c.e1; document.getElementById('emaVal2').value=c.e2; document.getElementById('emaVal3').value=c.e3; setDirection(c.d); } else { renderHeatmap(); } renderDateSelector(); }

        function setDirection(d) { 
            currentDir = d; 
            document.getElementById('btnLong').className = d==='long'?'px-5 py-2.5 font-black rounded-xl cursor-pointer bg-emerald-500 text-white shadow-lg':'px-5 py-2.5 font-black rounded-xl cursor-pointer bg-slate-100 text-slate-400';
            document.getElementById('btnShort').className = d==='short'?'px-5 py-2.5 font-black rounded-xl cursor-pointer bg-rose-500 text-white shadow-lg':'px-5 py-2.5 font-black rounded-xl cursor-pointer bg-slate-100 text-slate-400';
            document.getElementById('heatHeader').className = d==='long'?'p-6 bg-slate-900 text-white':'p-6 bg-indigo-950 text-white';
            document.getElementById('heatTitle').innerText = d==='long'?'上涨趋势热力榜':'下跌趋势热力榜';
            saveConfig(); renderTable(); renderHeatmap(AppState.lastTickers);
        }

        // --- 核心数值渲染：热力榜专色 vs 看板纯黑 ---
        function getHeatmapBiasHtml(val) {
            const num = parseFloat(val);
            if (num > 0) return `<span class="text-emerald-500 font-bold">+${num.toFixed(2)}%</span>`;
            if (num < 0) return `<span class="text-rose-500 font-bold">${num.toFixed(2)}%</span>`;
            return `<span class="text-slate-400 font-bold">0.00%</span>`;
        }

        async function fetchBinance(e) { try { const r = await fetch(`https://api.binance.com${e}`); return await r.json(); } catch(e) { return null; } }
        function calculateEMA(p, t) { let k = 2/(t+1), e = p[0]; for(let i=1; i<p.length; i++) e = p[i]*k + e*(1-k); return e; }
        function calculateRSI(c, p=14) { if(c.length<p+1) return 0; let g=0, l=0; for(let i=c.length-p; i<c.length; i++) { let d=c[i]-c[i-1]; if(d>=0) g+=d; else l-=d; } return 100-(100/(1+(g/p)/(l/p))); }
        function calculateHighDays(closes) { const cur = closes[closes.length - 1]; let count = 0; for(let i = closes.length - 2; i >= 0; i--) { if(cur > closes[i]) count++; else break; } return count; }

        async function startScan() {
            if (AppState.loading) return;
            const volL = parseFloat(document.getElementById('volumeInput').value)*1e6;
            const barThreshold = parseInt(document.getElementById('barsInput').value);
            const interval = document.getElementById('intervalInput').value;
            const pInt = interval === '1h' ? '4h' : (interval === '4h' ? '1d' : '1w');
            const emas = [parseInt(document.getElementById('emaVal1').value), parseInt(document.getElementById('emaVal2').value), parseInt(document.getElementById('emaVal3').value)].sort((a,b)=>a-b);
            
            AppState.loading = true; document.getElementById('scanBtn').disabled = true;
            AppState.longMatches = []; AppState.shortMatches = []; AppState.analyzedData = {};
            document.getElementById('progressCont').classList.remove('hidden');

            try {
                const tickers = await fetchBinance('/api/v3/ticker/24hr');
                AppState.lastTickers = tickers;
                const usdtPairs = tickers.filter(t => AppState.symbols.includes(t.symbol));

                // 强制识别 Top 30 涨跌幅币种，确保它们一定被分析，不漏掉数据
                const topG = [...usdtPairs].sort((a,b) => parseFloat(b.priceChangePercent) - parseFloat(a.priceChangePercent)).slice(0,30).map(t => t.symbol);
                const topL = [...usdtPairs].sort((a,b) => parseFloat(a.priceChangePercent) - parseFloat(b.priceChangePercent)).slice(0,30).map(t => t.symbol);
                const mustAnalyze = new Set([...topG, ...topL]);

                // 准备所有需要分析的名单：符合成交额门槛的 + 涨跌前30名的
                const qualified = usdtPairs.filter(t => parseFloat(t.quoteVolume) >= volL || mustAnalyze.has(t.symbol)).map(t => t.symbol);

                for(let i=0; i<qualified.length; i+=8) {
                    const batch = qualified.slice(i, i+8);
                    document.getElementById('progressBar').style.width = `${Math.round(i/qualified.length*100)}%`;
                    document.getElementById('statusDetail').innerText = `正在回溯深度数据: ${batch[0]}`;
                    
                    await Promise.all(batch.map(async (s) => {
                        const k = await fetchBinance(`/api/v3/klines?symbol=${s}&interval=${interval}&limit=220`);
                        if(!k || k.length < 150) return;
                        const closes = k.map(x => parseFloat(x[4])), quoteVols = k.map(x => parseFloat(x[7])), takersUSDT = k.map(x => parseFloat(x[10]));
                        const takerBuyRatio = ((takersUSDT[takersUSDT.length-1] / quoteVols[quoteVols.length-1]) * 100).toFixed(1);
                        const curP = closes[closes.length - 1];
                        const ema21 = calculateEMA(closes, 21);
                        const biasVal = (((curP - ema21) / ema21) * 100).toFixed(2);
                        const rsi = calculateRSI(closes).toFixed(1);
                        const rvol = (quoteVols[quoteVols.length-1] / (quoteVols.slice(-6, -1).reduce((a,b)=>a+b,0)/5)).toFixed(2);
                        const highDays = calculateHighDays(closes);

                        let isL = true, isS = true;
                        for(let b=0; b<barThreshold; b++) {
                            const idx = closes.length-1-b; const curE = emas.map(e => calculateEMA(closes.slice(0, idx+1), e));
                            if(!(closes[idx] > curE[0] && curE[0] > curE[1] && curE[1] > curE[2])) isL = false;
                            if(!(closes[idx] < curE[0] && curE[0] < curE[1] && curE[1] < curE[2])) isS = false;
                        }

                        let lB = 0, sB = 0;
                        if(isL) { for(let b=0; b<100; b++) { const idx=closes.length-1-b; if(idx<50)break; const curE=emas.map(e=>calculateEMA(closes.slice(0,idx+1),e)); if(closes[idx]>curE[0] && curE[0]>curE[1] && curE[1]>curE[2]) lB++; else break; } }
                        if(isS) { for(let b=0; b<100; b++) { const idx=closes.length-1-b; if(idx<50)break; const curE=emas.map(e=>calculateEMA(closes.slice(0,idx+1),e)); if(closes[idx]<curE[0] && curE[0]<curE[1] && curE[1]<curE[2]) sB++; else break; } }

                        const kp = await fetchBinance(`/api/v3/klines?symbol=${s}&interval=${pInt}&limit=120`);
                        let reso = false;
                        if(kp && kp.length > 50) {
                            const pC = kp.map(x => parseFloat(x[4])), pE = emas.map(e => calculateEMA(pC, e));
                            if(isL) reso = (pC[pC.length-1] > pE[0] && pE[0] > pE[1]);
                            if(isS) reso = (pC[pC.length-1] < pE[0] && pE[0] < pE[1]);
                        }
                        
                        const obj = { s, p: curP, bars: isL ? lB : sB, reso, tbr: takerBuyRatio, bias: biasVal, rvol, rsi, highDays, pInt: pInt.toUpperCase() };
                        AppState.analyzedData[s] = obj; 
                        
                        // 看板只显示满足门槛成交量且趋势通过的币种
                        const t = tickers.find(it => it.symbol === s);
                        if((parseFloat(t.quoteVolume) >= volL) && (isL || isS)) {
                            const finalObj = { ...obj, name: s.replace('USDT',''), c: parseFloat(t.priceChangePercent), v: parseFloat(t.quoteVolume), isNew: checkIsNew(s, isL?'long':'short') };
                            if(isL) AppState.longMatches.push(finalObj); if(isS) AppState.shortMatches.push(finalObj);
                            renderTable();
                        }
                    }));
                }
                updateHeatmapRecords(AppState.lastTickers); saveDailyMatches();
                document.getElementById('progressBar').style.width = "100%";
                document.getElementById('statusDetail').innerText = `扫描圆满完成`;
            } catch(e) { console.error(e); }
            finally { AppState.loading = false; document.getElementById('scanBtn').disabled = false; }
        }

        function updateHeatmapRecords(tickers) {
            const dk = new Date().toISOString().split('T')[0];
            const filtered = tickers.filter(t => AppState.symbols.includes(t.symbol));
            const getDetail = (symbol) => {
                const d = AppState.analyzedData[symbol];
                const t = tickers.find(x => x.symbol === symbol);
                return { s: symbol, c: t.priceChangePercent, v: t.quoteVolume, p: t.lastPrice, bias: d?.bias || '0.00', rvol: d?.rvol || '1.0', tbr: d?.tbr || '50.0', rsi: d?.rsi || '50.0', highDays: d?.highDays || '0' };
            };
            const topG = [...filtered].sort((a,b) => parseFloat(b.priceChangePercent) - parseFloat(a.priceChangePercent)).slice(0,30).map(t => getDetail(t.symbol));
            const topL = [...filtered].sort((a,b) => parseFloat(a.priceChangePercent) - parseFloat(b.priceChangePercent)).slice(0,30).map(t => getDetail(t.symbol));
            let s = JSON.parse(localStorage.getItem('ema_heat_v10_6') || '{"gain":{}, "lose":{}}');
            s.gain[dk] = topG; s.lose[dk] = topL;
            localStorage.setItem('ema_heat_v10_6', JSON.stringify(s));
            viewDate = dk; renderDateSelector(); renderHeatmap();
        }

        function renderDateSelector() {
            const container = document.getElementById('dateSelector');
            const store = JSON.parse(localStorage.getItem('ema_heat_v10_6') || '{"gain":{}, "lose":{}}');
            const weekDays = ['日','一','二','三','四','五','六'];
            const now = new Date(); const monday = new Date(now.setDate(now.getDate() - now.getDay() + (now.getDay() == 0 ? -6 : 1)));
            let html = '';
            for(let i=0; i<7; i++) {
                const d = new Date(monday); d.setDate(monday.getDate() + i);
                const dStr = d.toISOString().split('T')[0];
                const hasData = store.gain[dStr] ? 'has-data' : '';
                html += `<div onclick="switchViewDate('${dStr}')" class="date-chip ${dStr === viewDate ? 'active' : ''} ${hasData}">
                    <div>${weekDays[d.getDay()]}</div><div class="text-[7px] opacity-40">${dStr.slice(5)}</div>
                </div>`;
            }
            container.innerHTML = html;
        }

        function switchViewDate(d) { viewDate = d; renderDateSelector(); renderHeatmap(); }

        function renderHeatmap() {
            const isL = currentDir === 'long';
            const s = JSON.parse(localStorage.getItem('ema_heat_v10_6') || '{"gain":{}, "lose":{}}');
            const data = isL ? s.gain : s.lose;
            const list = data[viewDate] || [];
            let freq = {}; Object.values(data).forEach(dayList => dayList.forEach(item => freq[item.s] = (freq[item.s] || 0) + 1));
            const container = document.getElementById('heatmapContent');
            if(list.length === 0) { container.innerHTML = '<tr><td colspan="8" class="py-24 text-center text-slate-300 font-bold uppercase tracking-widest text-sm">No History Data</td></tr>'; return; }
            
            container.innerHTML = list.map((item, index) => {
                const count = freq[item.s] || 1;
                return `<tr class="heat-row ${count >= 3 ? (isL ? 'heat-high' : 'heat-high-short') : ''}">
                    <td class="py-4 pl-6 text-left">
                        <div class="flex flex-col">
                            <div class="flex items-center gap-1.5"><span class="rank-mini">${index+1}</span><a href="https://www.tradingview.com/chart/?symbol=BINANCE:${item.s}" target="_blank" class="tv-icon-lg !text-base"><i class="fas fa-chart-line text-blue-500"></i></a></div>
                            <div class="flex items-center gap-1 mt-1"><span class="font-black text-slate-900">${item.s.replace('USDT','')}</span><div class="text-[8px] font-black text-white px-1.5 py-0.5 ${isL?'bg-emerald-500':'bg-rose-500'} rounded uppercase">${count}日</div></div>
                        </div>
                    </td>
                    <td class="py-4"><span class="${parseFloat(item.c)>=0?'text-emerald-500':'text-rose-500'} font-black text-base">${parseFloat(item.c).toFixed(2)}%</span></td>
                    <td class="py-4 text-slate-400 mono font-bold">$${(parseFloat(item.v)/1e6).toFixed(1)}M</td>
                    <td class="py-4 font-mono font-bold text-slate-600">${item.tbr}%</td>
                    <td class="py-4 font-mono font-bold">${getHeatmapBiasHtml(item.bias)}</td>
                    <td class="py-4 font-mono font-bold text-slate-600">${item.rvol}x</td>
                    <td class="py-4 font-mono font-bold ${item.rsi > 70 ? 'text-orange-500' : item.rsi < 30 ? 'text-blue-500' : 'text-slate-500'}">${item.rsi}</td>
                    <td class="py-4 pr-6 text-right"><span class="bg-slate-100 text-slate-800 px-2 py-1 rounded-lg text-xs font-black">${item.highDays}天</span></td>
                </tr>`;
            }).join('');
        }

        function renderTable() {
            const data = currentDir === 'long' ? AppState.longMatches : AppState.shortMatches;
            const tbody = document.getElementById('resultsTable');
            data.sort((a,b) => b.v - a.v);
            document.getElementById('foundCountPill').innerText = `发现 ${data.length} 个信号`;
            if(data.length === 0) { tbody.innerHTML = `<tr><td colspan="9" class="py-48 text-center text-slate-200 font-black italic uppercase text-lg">No Signals</td></tr>`; return; }
            tbody.innerHTML = data.map((c, i) => `
                <tr class="hover:bg-slate-50/50 transition-all">
                    <td class="py-6 pl-8">
                        <div class="flex flex-col gap-1">
                            <div class="flex items-center gap-2">
                                <div class="rank-mini">${i+1}</div>
                                <a href="https://www.tradingview.com/chart/?symbol=BINANCE:${c.s}" target="_blank" class="tv-icon-lg"><i class="fas fa-chart-line text-blue-500"></i></a>
                            </div>
                            <div class="font-black text-slate-900 text-lg uppercase leading-none">${c.name}<span class="text-slate-300 text-[10px] font-bold">/USDT</span>${c.isNew ? '<span class="tag-new">新</span>' : ''}</div>
                        </div>
                    </td>
                    <td class="py-6 mono font-black text-slate-800 text-sm">$${c.p > 1 ? c.p.toLocaleString() : c.p.toFixed(6)}</td>
                    <td class="py-6 font-black ${c.c >= 0 ? 'text-emerald-500' : 'text-rose-500'} text-base">${c.c.toFixed(2)}%</td>
                    <td class="py-6 mono text-slate-400 font-bold">$${(c.v/1e6).toFixed(1)}M</td>
                    <td class="py-6"><span class="data-tag tag-buy">${c.tbr}%</span></td>
                    <!-- 趋势看板：恢复黑色字体样式 -->
                    <td class="py-6"><span class="font-black text-slate-800 text-sm">${c.bias}%</span></td>
                    <td class="py-6"><span class="data-tag tag-rvol">${c.rvol}x</span></td>
                    <td class="py-6"><span class="data-tag tag-rsi ${c.rsi > 70 ? '!text-orange-500' : c.rsi < 30 ? '!text-blue-500' : ''}">${c.rsi}</span></td>
                    <td class="py-6 pr-8 text-right">
                        <div class="reso-capsule ${c.reso ? 'reso-active' : ''}">
                            <span class="reso-count">${c.bars}根</span>
                            <span class="text-[8px] font-black text-slate-400 mt-0.5 uppercase tracking-tighter">${c.reso ? c.pInt+' 共振' : c.pInt+' 弱'}</span>
                        </div>
                    </td>
                </tr>`).join('');
        }

        function saveDailyMatches() {
            const k = new Date().toISOString().split('T')[0];
            let h = JSON.parse(localStorage.getItem('ema_daily_v10_6') || '{}');
            h[k] = { long: AppState.longMatches.map(m=>m.s), short: AppState.shortMatches.map(m=>m.s) };
            localStorage.setItem('ema_daily_v10_6', JSON.stringify(h));
        }
        function checkIsNew(s, dir) {
            const y = new Date(); y.setDate(y.getDate()-1);
            const yk = y.toISOString().split('T')[0];
            const h = JSON.parse(localStorage.getItem('ema_daily_v10_6') || '{}');
            return h[yk] ? !h[yk][dir].includes(s) : false;
        }

        function clearHeatmap() { if(confirm('Reset?')) { localStorage.removeItem('ema_heat_v10_6'); localStorage.removeItem('ema_daily_v10_6'); location.reload(); } }
        window.onload = loadConfig;
    </script>
</body>
</html>
