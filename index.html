<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Quant Pro V12.2 - 云端同步增强版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&family=Inter:wght@400;700;900&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .tab-btn { flex: 1; padding: 14px; text-align: center; font-weight: 900; font-size: 14px; cursor: pointer; border-radius: 1rem; color: #64748b; transition: all 0.2s; border: 1px solid transparent; }
        .tab-btn.active { background: #1e293b; color: #fde047; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .segmented-control { display: flex; background: white; border: 1px solid #e2e8f0; border-radius: 1rem; overflow: hidden; height: 100%; }
        .segment { flex: 1; padding: 0.8rem; border-right: 1px solid #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .segment:last-child { border-right: none; }
        .segment-label { font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
        .segment-input { width: 100%; border: none; text-align: center; font-weight: 900; color: #1e293b; font-size: 1.1rem; outline: none; background: transparent; }
        .rank-mini { width: 18px; height: 18px; border-radius: 50%; background: #fef9c3; color: #a16207; font-size: 9px; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 1px solid #fde047; }
        .tv-icon-lg { font-size: 16px; color: #94a3b8; transition: all 0.2s; cursor: pointer; }
        .reso-capsule { padding: 4px 12px; border-radius: 8px; background: #f1f5f9; display: flex; flex-direction: column; align-items: center; min-width: 80px; border: 1px solid #e2e8f0; }
        .reso-active { background: #dcfce7; border: 1px solid #22c55e; }
        .data-tag { padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; border: 1px solid #e2e8f0; font-family: 'JetBrains Mono'; }
        .tag-buy { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
        .tag-rvol { background: #fffbeb; color: #92400e; border-color: #fef3c7; }
        .tag-rsi { background: #f8fafc; color: #1e293b; border-color: #e2e8f0; }
        .date-chip { padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 900; color: #94a3b8; cursor: pointer; border: 1px solid transparent; text-align: center; transition: all 0.2s; }
        .date-chip.active { background: #3b82f6; color: white; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800 text-sm">
    <div id="app" class="max-w-[2200px] mx-auto">
        
        <!-- 顶部导航 & 操作区 -->
        <div class="flex flex-col lg:flex-row justify-between items-center mb-8 gap-4 bg-white p-4 rounded-3xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4">
                <div onclick="switchTab('trend')" id="tabTrend" class="tab-btn active"><i class="fas fa-layer-group mr-2"></i>趋势发现</div>
                <div onclick="switchTab('heatmap')" id="tabHeat" class="tab-btn"><i class="fas fa-fire mr-2"></i>涨跌热力</div>
                <div onclick="switchTab('breakout')" id="tabBreak" class="tab-btn"><i class="fas fa-crosshairs mr-2"></i>破高雷达</div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="text-right hidden sm:block mr-4">
                    <div id="progressText" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">System Ready</div>
                    <div id="statusDetail" class="text-[10px] font-bold text-blue-500">等待指令</div>
                </div>
                <div class="flex bg-slate-100 p-1.5 rounded-2xl gap-2 shadow-inner">
                    <button onclick="fetchCloudData()" class="px-6 py-2.5 bg-white text-blue-600 font-black rounded-xl text-xs hover:bg-blue-50 transition-all border border-slate-200"><i class="fas fa-cloud-download-alt mr-1"></i> 获取 08:01 数据</button>
                    <button id="tr_scanBtn" onclick="TrendModule.startScan()" class="px-8 py-2.5 bg-slate-900 text-white font-black rounded-xl text-xs hover:bg-black transition-all active:scale-95"><i class="fas fa-bolt text-yellow-400 mr-1"></i> 启动全向扫描</button>
                </div>
            </div>
        </div>

        <!-- 1. 趋势发现看板视图 -->
        <div id="viewTrend" class="tab-content">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
                <div class="segmented-control shadow-sm">
                    <div class="segment"><span class="segment-label">成交额(M)</span><input type="number" id="tr_vol" class="segment-input" value="15" onchange="TrendModule.saveConfig()"></div>
                    <div class="segment"><span class="segment-label">符合根数</span><input type="number" id="tr_bars" class="segment-input" value="10" onchange="TrendModule.saveConfig()"></div>
                    <div class="segment"><span class="segment-label">周期</span><select id="tr_int" class="segment-input" onchange="TrendModule.saveConfig()"><option value="1h">1H</option><option value="4h" selected>4H</option><option value="1d">1D</option></select></div>
                </div>
                <div class="segmented-control shadow-sm border-blue-50">
                    <div class="segment !flex-row !gap-4 !px-6">
                        <div id="tr_btnL" onclick="TrendModule.setDirection('long')" class="px-6 py-2 font-black rounded-xl cursor-pointer bg-emerald-500 text-white text-sm">上涨趋势</div>
                        <div id="tr_btnS" onclick="TrendModule.setDirection('short')" class="px-6 py-2 font-black rounded-xl cursor-pointer bg-slate-100 text-slate-400 text-sm">下跌趋势</div>
                    </div>
                    <div class="segment"><span class="segment-label">均线组</span><div class="flex gap-1 px-2"><input type="number" id="tr_ema1" class="segment-input !text-sm" value="21" onchange="TrendModule.saveConfig()"><input type="number" id="tr_ema2" class="segment-input !text-sm" value="55" onchange="TrendModule.saveConfig()"><input type="number" id="tr_ema3" class="segment-input !text-sm" value="100" onchange="TrendModule.saveConfig()"></div></div>
                </div>
            </div>
            <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden min-h-[700px]">
                <div id="tr_progCont" class="hidden h-1.5 bg-blue-100 overflow-hidden"><div id="tr_bar" class="h-full bg-blue-600 transition-all duration-300 w-0"></div></div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead><tr class="text-slate-400 text-[10px] font-black uppercase tracking-widest border-b"><th class="py-6 pl-10">资产名称</th><th>价格</th><th>24H涨跌</th><th>24H成交额</th><th>主买</th><th>乖离</th><th>动能</th><th>RSI</th><th class="pr-10 text-right">趋势共振</th></tr></thead>
                        <tbody id="tr_table" class="divide-y divide-slate-50 font-bold text-slate-800 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 2. 涨跌热力榜视图 -->
        <div id="viewHeatmap" class="tab-content hidden">
            <!-- 热力榜表格化排版 -->
            <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden flex flex-col min-h-[800px]">
                <div id="ht_header" class="p-8 bg-slate-900 text-white flex justify-between items-center">
                    <div><h2 id="ht_title" class="text-2xl font-black italic tracking-tighter text-emerald-400">涨幅热力榜</h2><button onclick="HeatmapModule.startScan()" id="ht_scanBtn" class="mt-4 bg-blue-600 text-white px-8 py-2.5 rounded-xl font-black text-xs">启动热力独立分析</button></div>
                    <div id="ht_dateSelector" class="flex gap-2"></div>
                </div>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-center">
                        <thead><tr class="bg-slate-50 text-[10px] text-slate-400 font-black uppercase"><th class="py-6 pl-8 text-left">资产</th><th>涨跌</th><th>成交量</th><th>主买</th><th>乖离(1D)</th><th>动能</th><th>RSI</th><th class="pr-8 text-right">破高(天)</th></tr></thead>
                        <tbody id="ht_table" class="divide-y divide-slate-50 font-bold text-sm text-slate-800"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 3. 破高雷达视图 -->
        <div id="viewBreakout" class="tab-content hidden">
            <!-- 破高逻辑内容 -->
            <div class="flex flex-col md:flex-row gap-4 mb-8">
                <div class="bg-white rounded-2xl p-4 flex gap-8 items-center shadow-sm border">
                    <span class="text-xs font-black text-slate-400 uppercase tracking-widest">探测周期:</span>
                    <label class="flex items-center gap-2 font-black cursor-pointer"><input type="radio" name="brInt" value="1h"> 1H</label>
                    <label class="flex items-center gap-2 font-black cursor-pointer"><input type="radio" name="brInt" value="4h" checked> 4H</label>
                    <label class="flex items-center gap-2 font-black cursor-pointer"><input type="radio" name="brInt" value="12h"> 12H</label>
                </div>
                <button onclick="BreakoutModule.startScan()" id="br_scanBtn" class="flex-1 bg-indigo-600 text-white font-black py-4 rounded-2xl shadow-xl active:scale-95 transition-all text-sm uppercase tracking-widest italic font-black">启动 300 根全量破高探测</button>
            </div>
            <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden min-h-[700px]">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead><tr class="text-[10px] text-slate-400 font-black uppercase tracking-widest border-b"><th class="py-6 pl-10">资产名称</th><th>价格</th><th>成交额(M)</th><th>24H涨跌</th><th>动能(RVOL)</th><th>主买占比</th><th class="pr-10 text-right">破高天数</th></tr></thead>
                        <tbody id="br_table" class="divide-y divide-slate-50 font-bold text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 核心逻辑：云端同步 (适配 V12.2) ---
        async function fetchCloudData() {
            try {
                document.getElementById('statusDetail').innerText = "☁️ 正在同步 08:01 存档...";
                const r = await fetch('last_scan.json?t=' + Date.now());
                if(!r.ok) throw new Error("云端文件尚未生成");
                const auto = await r.json();
                
                // 注意：这里需要存入 V12.2 使用的 localStorage 键名
                let s = JSON.parse(localStorage.getItem('ema_heat_v12_data') || '{"gain":{}, "lose":{}}');
                s.gain[auto.date] = auto.gainers;
                s.lose[auto.date] = auto.losers;
                localStorage.setItem('ema_heat_v12_data', JSON.stringify(s));
                
                HeatmapModule.viewDate = auto.date;
                HeatmapModule.renderDates();
                HeatmapModule.render();
                alert(`✅ 同步成功！${auto.date} 存档已就绪。`);
            } catch(e) { alert("云端调取失败：" + e.message); }
        }

        // --- 全局工具 & 状态 ---
        const Utils = {
            symbols: ['BTCUSDT','ETHUSDT','BNBUSDT','XRPUSDT','SOLUSDT','TRXUSDT','DOGEUSDT','ADAUSDT','BCHUSDT','WBTCUSDT','LINKUSDT','HYPEUSDT','XMRUSDT','LEOUSDT','ZECUSDT','XLMUSDT','LTCUSDT','SUIUSDT','AVAXUSDT','HBARUSDT','SHIBUSDT','CROUSDT','TONUSDT','UNIUSDT','WLFIUSDT','CCUSDT','WBETHUSDT','MNTUSDT','USD1USDT','DOTUSDT','AAVEUSDT','OKBUSDT','TAOUSDT','BITUSDT','FTMUSDT','NEARUSDT','ETCUSDT','ICPUSDT','PEPEUSDT','PepeUSDT','ENAUSDT','MKRUSDT','WLDUSDT','ONDOUSDT','APTUSDT','POLUSDT','ARBUSDT','ALGOUSDT','ATOMUSDT','FILUSDT','FLRUSDT','QNTUSDT','VETUSDT','GTUSDT','SEIUSDT','BONKUSDT','RENDERUSDT','CAKEUSDT','JUPUSDT','OPUSDT','FETUSDT','LDOUSDT','STXUSDT','TIAUSDT','GALAUSDT','PENDLEUSDT','THETAUSDT','NEOUSDT','RUNEUSDT','INJUSDT','DYDXUSDT','STRKUSDT','GRTUSDT','FLOKIUSDT','JASMYUSDT','ZKUSDT','SANDUSDT','EIGENUSDT','HNTUSDT','FLOWUSDT','EOSUSDT','COMPUSDT','RAYUSDT','MANAUSDT','ARUSDT','LUNCUSDT','1INCHUSDT','XECUSDT','GLMUSDT','EGLDUSDT','FTTUSDT','SFPUSDT','RSRUSDT','NEIROUSDT','APEUSDT','JTOUSDT','ATHUSDT','SNXUSDT','AXSUSDT','LPTUSDT'],
            ema: (p, t) => { if(p.length < t) return 0; let k = 2/(t+1), e = p[0]; for(let i=1; i<p.length; i++) e = p[i]*k + e*(1-k); return e; },
            rsi: (c, p=14) => { if(c.length < p+1) return 50; let g=0, l=0; for(let i=c.length-p; i<c.length; i++) { let d = c[i]-c[i-1]; if(d>=0) g+=d; else l-=d; } return 100-(100/(1+(g/p)/(l/p+0.0001))); },
            fetch: async (u) => { try { const r = await fetch(`https://api.binance.com${u}`); return await r.json(); } catch(e) { return null; } }
        };

        // --- 1. 趋势发现看板模块 ---
        const TrendModule = {
            longMatches: [], shortMatches: [],
            saveConfig: () => {
                const cfg = { v: document.getElementById('tr_vol').value, b: document.getElementById('tr_bars').value, i: document.getElementById('tr_int').value, e1: document.getElementById('tr_ema1').value, e2: document.getElementById('tr_ema2').value, e3: document.getElementById('tr_ema3').value };
                localStorage.setItem('ema_v12_trend_cfg', JSON.stringify(cfg));
            },
            setDirection: (d) => { currentDir = d; TrendModule.render(); },
            startScan: async () => {
                const btn = document.getElementById('tr_scanBtn'); btn.disabled = true;
                const volL = parseFloat(document.getElementById('tr_vol').value)*1e6;
                const threshold = parseInt(document.getElementById('tr_bars').value);
                const interval = document.getElementById('tr_int').value;
                const emas = [parseInt(document.getElementById('tr_ema1').value), parseInt(document.getElementById('tr_ema2').value), parseInt(document.getElementById('tr_ema3').value)].sort((a,b)=>a-b);
                const pInt = interval==='1h'?'4h':(interval==='4h'?'1d':'1w');

                TrendModule.longMatches = []; TrendModule.shortMatches = [];
                document.getElementById('tr_progCont').classList.remove('hidden');
                
                try {
                    const tickers = await Utils.fetch('/api/v3/ticker/24hr');
                    const qualified = Utils.symbols.filter(s => { const t = tickers.find(i => i.symbol === s); return t && parseFloat(t.quoteVolume) >= volL; });

                    for(let i=0; i<qualified.length; i+=8) {
                        const batch = qualified.slice(i, i+8);
                        await Promise.all(batch.map(async (s) => {
                            const k = await Utils.fetch(`/api/v3/klines?symbol=${s}&interval=${interval}&limit=220`);
                            if(!k || k.length < 150) return;
                            const closes = k.map(x => parseFloat(x[4])), quoteVols = k.map(x => parseFloat(x[7])), takers = k.map(x => parseFloat(x[10]));
                            const tInfo = tickers.find(it => it.symbol === s);
                            const curP = closes[closes.length-1];
                            const tbr = ((takers[takers.length-1]/quoteVols[quoteVols.length-1])*100).toFixed(1);
                            const rvol = (quoteVols[quoteVols.length-1]/(quoteVols.slice(-6,-1).reduce((a,b)=>a+b,0)/5+0.01)).toFixed(2);
                            
                            let isL = true, isS = true;
                            for(let b=0; b<threshold; b++) {
                                const idx = closes.length-1-b; const curE = emas.map(e => Utils.ema(closes.slice(0,idx+1), e));
                                if(!(closes[idx]>curE[0] && curE[0]>curE[1] && curE[1]>curE[2])) isL = false;
                                if(!(closes[idx]<curE[0] && curE[0]<curE[1] && curE[1]<curE[2])) isS = false;
                            }
                            if(isL || isS) {
                                let c = 0; for(let b=0; b<100; b++) { const idx=closes.length-1-b; if(idx<50) break; const curE = emas.map(e => Utils.ema(closes.slice(0,idx+1), e)); if(isL && closes[idx]>curE[0] && curE[0]>curE[1] && curE[1]>curE[2]) c++; else if(isS && closes[idx]<curE[0] && curE[0]<curE[1] && curE[1]<curE[2]) c++; else break; }
                                const kp = await Utils.fetch(`/api/v3/klines?symbol=${s}&interval=${pInt}&limit=120`);
                                let reso = false; if(kp && kp.length > 50) { const pC = kp.map(x => parseFloat(x[4])), pe1 = Utils.ema(pC, emas[0]), pe2 = Utils.ema(pC, emas[1]); if(isL) reso = (pC[pC.length-1] > pe1 && pe1 > pe2); if(isS) reso = (pC[pC.length-1] < pe1 && pe1 < pe2); }
                                const res = { s, p: curP, c: parseFloat(tInfo.priceChangePercent), v: parseFloat(tInfo.quoteVolume), tbr, bias: (((curP-Utils.ema(closes, 21))/Utils.ema(closes, 21))*100).toFixed(2), rvol, rsi: Utils.rsi(closes).toFixed(1), reso, bars: c, pInt: pInt.toUpperCase() };
                                if(isL) TrendModule.longMatches.push(res); else TrendModule.shortMatches.push(res);
                                TrendModule.render();
                            }
                        }));
                        document.getElementById('tr_bar').style.width = Math.round((i/qualified.length)*100) + '%';
                        await new Promise(r => setTimeout(r, 450));
                    }
                } catch(e) {}
                btn.disabled = false; document.getElementById('tr_bar').style.width = '100%';
            },
            render: () => {
                const data = currentDir === 'long' ? TrendModule.longMatches : TrendModule.shortMatches;
                const tbody = document.getElementById('tr_table'); data.sort((a,b) => b.v - a.v);
                document.getElementById('foundCountPill').innerText = `发现 ${data.length} 个信号`;
                tbody.innerHTML = data.map((c, i) => `<tr class="hover:bg-slate-50 transition-all"><td class="py-6 pl-10"><div class="flex flex-col gap-1"><div class="flex items-center gap-2"><div class="rank-mini">${i+1}</div><a href="https://www.tradingview.com/chart/?symbol=BINANCE:${c.s}" target="_blank" class="tv-icon-lg"><i class="fas fa-chart-line text-blue-500"></i></a></div><div class="font-black text-slate-900 text-lg uppercase leading-none">${c.s.replace('USDT','')}<span class="text-slate-300 text-[10px] font-bold">/USDT</span></div></div></td><td class="py-6 mono font-black text-slate-800 text-sm">$${c.p > 1 ? c.p.toLocaleString() : c.p.toFixed(6)}</td><td class="${c.c>=0?'text-emerald-500':'text-rose-500'} text-base font-black">${c.c.toFixed(2)}%</td><td class="py-6 mono text-slate-400 font-bold">$${(c.v/1e6).toFixed(1)}M</td><td><span class="data-tag tag-buy">${c.tbr}%</span></td><td class="font-black">${parseFloat(c.bias)>0?'+':''}${c.bias}%</td><td><span class="data-tag tag-rvol">${c.rvol}x</span></td><td><span class="data-tag tag-rsi">${c.rsi}</span></td><td class="py-6 pr-10 text-right"><div class="reso-capsule ${c.reso?'reso-active':''}"><span class="reso-count">${c.bars}根</span><span class="text-[8px] font-black text-slate-400 uppercase tracking-tighter">${c.pInt} ${c.reso?'共振':'弱'}</span></div></td></tr>`).join('');
            }
        };

        // --- 2. 热力榜模块 ---
        const HeatmapModule = {
            viewDate: new Date().toISOString().split('T')[0],
            analyzed: {},
            setDirection: (d) => { currentDir = d; HeatmapModule.render(); },
            startScan: async () => {
                document.getElementById('ht_scanBtn').disabled = true; document.getElementById('ht_progCont').classList.remove('hidden');
                try {
                    const tickers = await Utils.fetch('/api/v3/ticker/24hr');
                    const filtered = tickers.filter(t => Utils.symbols.includes(t.symbol));
                    const topG = [...filtered].sort((a,b) => parseFloat(b.priceChangePercent) - parseFloat(a.priceChangePercent)).slice(0,30).map(t => t.symbol);
                    const topL = [...filtered].sort((a,b) => parseFloat(a.priceChangePercent) - parseFloat(b.priceChangePercent)).slice(0,30).map(t => t.symbol);
                    const all = [...new Set([...topG, ...topL])];
                    const interval = document.querySelector('input[name="ht_int"]:checked').value;
                    
                    for(let i=0; i<all.length; i+=8) {
                        const batch = all.slice(i, i+8);
                        await Promise.all(batch.map(async (s) => {
                            const k = await Utils.fetch(`/api/v3/klines?symbol=${s}&interval=1d&limit=220`);
                            if(!k || k.length < 50) return;
                            const closes = k.map(x => parseFloat(x[4])), quoteVols = k.map(x => parseFloat(x[7])), takers = k.map(x => parseFloat(x[10]));
                            const t = tickers.find(x => x.symbol === s);
                            const curP = closes[closes.length-1], e21 = Utils.ema(closes, 21);
                            let hD = 0; for(let j=closes.length-2; j>=0; j--) { if(curP>closes[j]) hD++; else break; }
                            HeatmapModule.analyzed[s] = { s, bias: (((curP-e21)/e21)*100).toFixed(2), hiD: hD, rsi: Utils.rsi(closes).toFixed(1), rvol: (quoteVols[quoteVols.length-1]/(quoteVols.slice(-6,-1).reduce((a,b)=>a+b,0)/5+0.01)).toFixed(2), tbr: ((takers[takers.length-1]/quoteVols[quoteVols.length-1])*100).toFixed(1), c: t.priceChangePercent, v: t.quoteVolume };
                        }));
                        document.getElementById('ht_bar').style.width = Math.round((i/all.length)*100) + '%';
                        await new Promise(r => setTimeout(r, 450));
                    }
                    const dk = new Date().toISOString().split('T')[0];
                    let s = JSON.parse(localStorage.getItem('ema_heat_v12_data') || '{"gain":{}, "lose":{}}');
                    s.gain[dk] = topG.map(sym => HeatmapModule.analyzed[sym]).filter(x=>x);
                    s.lose[dk] = topL.map(sym => HeatmapModule.analyzed[sym]).filter(x=>x);
                    localStorage.setItem('ema_heat_v12_data', JSON.stringify(s));
                    HeatmapModule.viewDate = dk; HeatmapModule.renderDates(); HeatmapModule.render();
                } catch(e) {}
                document.getElementById('ht_scanBtn').disabled = false; document.getElementById('ht_progCont').classList.add('hidden');
            },
            renderDates: () => {
                const cont = document.getElementById('ht_dateSelector'); const s = JSON.parse(localStorage.getItem('ema_heat_v12_data') || '{"gain":{}, "lose":{}}');
                const week = ['日','一','二','三','四','五','六']; const now = new Date(); const monday = new Date(now.setDate(now.getDate()-now.getDay()+(now.getDay()==0?-6:1)));
                let html = ''; for(let i=0; i<7; i++) { const d = new Date(monday); d.setDate(monday.getDate()+i); const dS = d.toISOString().split('T')[0]; html += `<div onclick="HeatmapModule.switchDate('${dS}')" class="date-chip ${dS===HeatmapModule.viewDate?'active':''} ${s.gain[dS]?'has-data':''}"><div>${week[d.getDay()]}</div><div class="text-[7px] opacity-40">${dS.slice(5)}</div></div>`; } cont.innerHTML = html;
            },
            switchDate: (d) => { HeatmapModule.viewDate = d; HeatmapModule.renderDates(); HeatmapModule.render(); },
            render: () => {
                const isL = currentDir === 'long'; const isG = HeatmapModule.dir === 'gain';
                const s = JSON.parse(localStorage.getItem('ema_heat_v12_data') || '{"gain":{}, "lose":{}}');
                const data = (isG ? s.gain : s.lose)[HeatmapModule.viewDate] || [];
                let freq = {}; Object.values(isG ? s.gain : s.lose).forEach(l => l.forEach(i => freq[i.s] = (freq[i.s] || 0) + 1));
                const body = document.getElementById('ht_table');
                body.innerHTML = data.map((d, idx) => `<tr><td class="py-5 pl-8 text-left font-black">${d.s.replace('USDT','')}<div class="text-[8px] bg-blue-500 text-white px-1.5 rounded w-fit mt-1">${freq[d.s]||1}日</div></td><td class="${parseFloat(d.c)>=0?'text-emerald-500':'text-rose-500'} font-black text-base">${d.c}%</td><td class="mono text-slate-400 text-xs">$${(parseFloat(d.v)/1e6).toFixed(1)}M</td><td><span class="data-tag tag-buy">${d.tbr}%</span></td><td class="${parseFloat(d.bias)>=0?'text-emerald-500':'text-rose-500'} font-black">${parseFloat(d.bias)>0?'+':''}${d.bias}%</td><td><span class="data-tag tag-rvol">${d.rvol}x</span></td><td><span class="data-tag tag-rsi">${d.rsi}</span></td><td class="pr-8 text-right font-black text-blue-600">${d.hiD}天</td></tr>`).join('');
            }
        };

        // --- 3. 破高雷达模块 ---
        const BreakoutModule = {
            startScan: async () => {
                const btn = document.getElementById('br_scanBtn'); btn.disabled = true;
                const interval = document.querySelector('input[name="br_int"]:checked').value;
                const body = document.getElementById('br_table'); body.innerHTML = "";
                try {
                    const tickers = await Utils.fetch('/api/v3/ticker/24hr');
                    for(let i=0; i<Utils.symbols.length; i+=8) {
                        const batch = Utils.symbols.slice(i, i+8);
                        await Promise.all(batch.map(async (s) => {
                            const k = await Utils.fetch(`/api/v3/klines?symbol=${s}&interval=${interval}&limit=305`);
                            if(!k || k.length < 100) return;
                            const closes = k.map(x => parseFloat(x[4])), quoteVols = k.map(x => parseFloat(x[7])), takers = k.map(x => parseFloat(x[10]));
                            const tInfo = tickers.find(x => x.symbol === s);
                            const curP = closes[closes.length-1];
                            let count = 0; for(let j=closes.length-2; j>=0; j--) { if(curP>closes[j]) count++; else break; }
                            if(count < 60) return;
                            let color = count>=300?'br-max':(count>=240?'br-red':(count>=120?'br-blue':'br-yellow'));
                            body.innerHTML += `<tr><td class="py-6 pl-10 font-black">${s.replace('USDT','')}</td><td class="mono font-black text-slate-800 text-sm">$${parseFloat(tInfo.lastPrice).toLocaleString()}</td><td class="mono text-slate-400 font-bold">$${(parseFloat(tInfo.quoteVolume)/1e6).toFixed(1)}M</td><td class="${parseFloat(tInfo.priceChangePercent)>=0?'text-emerald-500':'text-rose-500'} font-black text-base">${tInfo.priceChangePercent}%</td><td><span class="data-tag tag-rvol">${(quoteVols[quoteVols.length-1]/(quoteVols.slice(-6,-1).reduce((a,b)=>a+b,0)/5+0.01)).toFixed(2)}x</span></td><td><span class="data-tag tag-buy">${((takers[takers.length-1]/quoteVols[quoteVols.length-1])*100).toFixed(1)}%</span></td><td class="pr-10 text-right"><span class="px-5 py-2 rounded-xl font-black ${color}">${count} 根</span></td></tr>`;
                        }));
                        await new Promise(r => setTimeout(r, 450));
                    }
                } catch(e) {}
                btn.disabled = false;
            }
        };

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1)).classList.remove('hidden');
            document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
        }

        window.onload = () => { loadConfig(); HeatmapModule.init(); };
    </script>
</body>
</html>
